<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz San Valentín</title>
  <style>
    body {
      background-color: #ffe6f0;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px;
      overflow: hidden;
    }
    h1 {
      color: #d63384;
      font-size: 40px;
    }
    #mensaje {
      font-size: 20px;
      color: #6c757d;
      margin-top: 20px;
    }
    button {
      background-color: #d63384;
      color: white;
      padding: 10px 20px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 20px;
    }
    .corazon {
      position: absolute;
      color: #ff3366;
      font-size: 24px;
      animation: flotar 5s linear infinite;
      top: 100%;
    }
    @keyframes flotar {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>💘 ¡Feliz San Valentín! 💘</h1>
  <p id="mensaje">Haz clic para ver tu mensaje especial...</p>
  <button onclick="mostrarAmor()">Mostrar Mensaje</button>

  <script>
    function mostrarAmor() {
      document.getElementById("mensaje").innerText =
        "Mi amor por ti crece cada día. ¡Eres mi San Valentín favorito! 💖";
    }

    // Generar corazones animados
    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('corazon');
      heart.style.left = Math.random() * 100 + "vw";
      heart.innerHTML = '❤️';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 300);
  </script>

</body>
</html>
