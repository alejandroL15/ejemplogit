<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz Día de la Madre</title>
  <style>
    body { text-align: center; background-color: #fff0f5; font-family: sans-serif; }
    h1 { color: #e91e63; }
    #mensaje { font-size: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🌸 ¡Feliz Día de la Madre! 🌸</h1>
  <p id="mensaje">Gracias por tanto amor, mamá 💖</p>
  <button onclick="mostrarMensaje()">Haz clic para un mensaje especial</button>

  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").innerText = "Eres la mejor mamá del mundo. ¡Te amo! 💐";
    }
  </script>
</body>
</html>
